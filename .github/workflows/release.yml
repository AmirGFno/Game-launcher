name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Release builds are tested too - unit tests cover target validation, safe
      # cleanup, atomic persistence, image validation and cache behaviour.
      - name: Run tests
        run: dotnet test tests/GFnoLauncher.Tests/GFnoLauncher.Tests.csproj -c Release --nologo -v minimal

      - name: Publish self-contained single-file executable
        run: >-
          dotnet publish
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o "${{ github.workspace }}/publish"

      # ---- Version -------------------------------------------------------
      # The release version is read from the project file (the single source of
      # truth) and cross-checked against the tag that triggered the run, so a
      # mismatched tag fails the release instead of publishing the wrong name.
      - name: Read release version
        run: |
          $version = (Select-Xml -Path "$env:GITHUB_WORKSPACE\GameLauncher.csproj" -XPath "//Version").Node.InnerText
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          Write-Host "GameLauncher.csproj <Version>: $version"
          Write-Host "Tag:                            $tag"
          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Host "##[error]GameLauncher.csproj does not define a <Version>."
            exit 1
          }
          if ($version -ne $tag) {
            Write-Host "##[error]Version mismatch: GameLauncher.csproj is $version but the tag is v$tag."
            exit 1
          }
          Set-Content -Path "$env:GITHUB_WORKSPACE\release-version.txt" -Value $version -NoNewline
          Write-Host "Release version: $version"

      # ---- Regression guard ------------------------------------------------
      # MainWindow.xaml references its images with relative URIs, which WPF resolves
      # to pack://application:,,,/Assets/... . If the images are not embedded as WPF
      # resources the app still builds fine but dies on startup with
      # "TypeConverterMarkupExtension ... Cannot locate resource 'assets/icon.png'".
      # This step fails the build when the resources are missing.
      - name: Verify embedded WPF resources
        run: |
          dotnet build GameLauncher.csproj -c Release --nologo -v minimal
          $dll = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\bin" -Filter "GFnoLauncher.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) {
            Write-Host "##[error]GFnoLauncher.dll was not found under bin/."
            exit 1
          }
          Write-Host "Checking embedded resources in: $($dll.FullName)"
          $assembly = [System.Reflection.Assembly]::LoadFile($dll.FullName)
          $manifest = @($assembly.GetManifestResourceNames() | Where-Object { $_ -like "*.g.resources" })
          if ($manifest.Count -eq 0) {
            Write-Host "##[error]No .g.resources manifest found in the assembly."
            exit 1
          }
          $stream = $assembly.GetManifestResourceStream($manifest[0])
          if (-not $stream) {
            Write-Host "##[error]Could not open the .g.resources stream."
            exit 1
          }
          $reader = New-Object System.Resources.ResourceReader($stream)
          $names = @{}
          $enumerator = $reader.GetEnumerator()
          while ($enumerator.MoveNext()) { $names[[string]$enumerator.Key] = $true }
          $reader.Close()
          foreach ($required in @("assets/icon.png", "assets/icon.ico")) {
            $match = $names.Keys | Where-Object { $_ -ieq $required } | Select-Object -First 1
            if (-not $match) {
              Write-Host "##[error]Missing embedded WPF resource: $required"
              $names.Keys | ForEach-Object { Write-Host "    found: $_" }
              exit 1
            }
            Write-Host "OK embedded resource: $match"
          }

      # ---- Portable package -------------------------------------------------
      # A successful `dotnet publish` is not proof that the package is usable, so
      # the publish output is inspected before it is zipped.
      - name: Verify publish output
        run: |
          $publish = "$env:GITHUB_WORKSPACE\publish"
          if (-not (Test-Path $publish)) {
            Write-Host "##[error]The publish directory does not exist."
            exit 1
          }
          $entries = @(Get-ChildItem $publish -File)
          Write-Host "publish/ contains $($entries.Count) file(s):"
          $entries | ForEach-Object { Write-Host "    $($_.Name)" }
          $exe = Join-Path $publish "GFnoLauncher.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "##[error]publish\GFnoLauncher.exe was not produced by dotnet publish."
            exit 1
          }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "OK portable executable: GFnoLauncher.exe ($size MB)"

      - name: Create ZIP archive (portable)
        run: |
          $version = Get-Content "$env:GITHUB_WORKSPACE\release-version.txt"
          $zip = "$env:GITHUB_WORKSPACE\GFnoLauncher-$version-win-x64-portable.zip"
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\publish\*" -DestinationPath $zip
          if (-not (Test-Path $zip)) {
            Write-Host "##[error]The portable ZIP was not created."
            exit 1
          }
          $size = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "Portable package: GFnoLauncher-$version-win-x64-portable.zip ($size MB)"

      # ---- Installer ------------------------------------------------------
      - name: Install Inno Setup
        run: |
          curl.exe -L --fail --silent --show-error `
            -o "$env:TEMP\innosetup.exe" `
            "https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe"
          Start-Process -FilePath "$env:TEMP\innosetup.exe" `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CLOSEAPPLICATIONS","/RESTARTAPPLICATIONS" `
            -Wait
          $candidates = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not found after installing Inno Setup." }
          Write-Host "Using Inno Setup compiler: $iscc"

      - name: Compile installer
        run: |
          # Resolve the compiler here as well - relying on GITHUB_ENV for the path
          # proved unreliable.
          $candidates = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "##[error]ISCC.exe was not found on this runner."
            exit 1
          }
          Write-Host "Compiling installer with: $iscc"

          $out = & $iscc "$env:GITHUB_WORKSPACE\setup.iss" 2>&1
          $code = $LASTEXITCODE
          $text = $out | Out-String
          [System.IO.File]::WriteAllText("$env:GITHUB_WORKSPACE\iscc.log", $text)

          if ($code -ne 0) {
            # Surface the compiler output through annotations (chunked + base64) so
            # the failure reason is readable from the run summary.
            $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text))
            Write-Host "##[error]Inno Setup failed with exit code $code"
            $i = 0
            while ($i -lt $b64.Length) {
              $chunk = $b64.Substring($i, [Math]::Min(240, $b64.Length - $i))
              Write-Host "##[error]LOG $i $chunk"
              $i += 240
            }
            exit 1
          }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\GFnoLauncher-Setup.exe")) {
            Write-Host "##[error]GFnoLauncher-Setup.exe was not produced."
            exit 1
          }

          # Publish the installer under a versioned file name.
          $version = Get-Content "$env:GITHUB_WORKSPACE\release-version.txt"
          Copy-Item "$env:GITHUB_WORKSPACE\GFnoLauncher-Setup.exe" "$env:GITHUB_WORKSPACE\GFnoLauncher-Setup-$version.exe"
          $size = [math]::Round((Get-Item "$env:GITHUB_WORKSPACE\GFnoLauncher-Setup-$version.exe").Length / 1MB, 1)
          Write-Host "Installer produced: GFnoLauncher-Setup-$version.exe ($size MB)"

      - name: Upload Inno Setup log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: iscc-log
          path: iscc.log
          if-no-files-found: ignore
          retention-days: 1

      # ---- Checksums ------------------------------------------------------
      - name: Generate SHA-256 checksums
        run: |
          $version = Get-Content "$env:GITHUB_WORKSPACE\release-version.txt"
          $files = @(
            "GFnoLauncher-$version-win-x64-portable.zip",
            "GFnoLauncher-Setup-$version.exe"
          )
          $lines = @()
          foreach ($file in $files) {
            $path = Join-Path $env:GITHUB_WORKSPACE $file
            if (-not (Test-Path $path)) {
              Write-Host "##[error]Missing release asset: $file"
              exit 1
            }
            $hash = (Get-FileHash -Path $path -Algorithm SHA256).Hash
            $lines += "$hash  $file"
            Write-Host "$hash  $file"
          }
          Set-Content -Path "$env:GITHUB_WORKSPACE\SHA256SUMS.txt" -Value $lines -Encoding ascii
          Write-Host "SHA256SUMS.txt written."

      # ---- Release --------------------------------------------------------
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: "GFno Launcher 2.0.0"
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            GFnoLauncher-2.0.0-win-x64-portable.zip
            GFnoLauncher-Setup-2.0.0.exe
            SHA256SUMS.txt
          body: |
            ## Highlights

            GFno Launcher 2.0.0 is the first stable release: a dark, PS5-inspired Windows desktop game launcher built with C# / WPF on .NET 10.

            - Point it at a game `.exe` or a Steam URL and it reads the title and logo straight out of the executable.
            - Horizontal logo carousel with a Ken Burns background, cross-fading artwork and a glow tinted from each logo's dominant colour.
            - Artwork can be downloaded from a direct URL or picked from a local file, and is decoded off the UI thread.
            - WebP artwork is supported through a bundled, pure-managed image decoder.
            - Single instance, system tray, reorder mode, and an editor that preserves every metadata field.

            ## Security and reliability

            - **Runs as a standard user.** The application manifest requests `asInvoker` and the installer uses `PrivilegesRequired=lowest` - no UAC prompt and no mandatory Administrator execution.
            - **Filesystem safety before anything is deleted.** Every path is expanded with `Path.GetFullPath` and must lie strictly inside the application-owned cache folder. Drive roots, junctions / symbolic links and protected system or personal folders are rejected.
            - **Cleanup is optional and scoped.** Only `%LocalAppData%\GameLauncher\Cache` can ever be cleaned, and only after a preview and an explicit confirmation. The operation is cancellable and locked files are skipped. `%TEMP%`, `C:\Windows\Temp` and per-game folders are never touched.
            - **Crash-safe library persistence.** `library.json` is written to a temporary file, flushed and swapped in atomically, keeping a `.bak` copy of the previous file. Writers are serialised so concurrent saves cannot interleave, and a corrupted file is moved aside (never deleted) so the library stays recoverable.
            - **Validated downloads.** Image downloads are capped at 25 MB, streamed to a temporary file, checked as real decodable images with sane dimensions, and incomplete files are removed.
            - **Restricted launch targets.** Only an explicit allowlist of store protocols (Steam, Epic, Ubisoft, Origin, Battle.net, GOG Galaxy) plus `.exe` paths. Arbitrary URI schemes are rejected.
            - **Dependency status.** `SixLabors.ImageSharp` stays at 3.1.12 deliberately. 3.2.0 is the first 3.x release that patches the published ImageSharp advisories (TIFF fax/CCITT encoder and decoder out-of-bounds writes, `HistogramEqualization` index validation, ICC CLUT allocation, BigTIFF decoder loop), but it also adds build-time license enforcement that requires a paid Six Labors license key, which this free project cannot satisfy. Moving to 3.2.0 is therefore deferred until a license is available; the code compiles and runs against the 3.x API either way.

            ## Performance and stability

            - Artwork is decoded on a worker thread and downscaled while decoding (maximum 1920 px backgrounds, 256 px logos), so a multi-megapixel wallpaper never freezes the interface or sits in memory at full resolution.
            - Decoded bitmaps are cached with a 256 MB budget and least-recently-used eviction, keyed by the source file's write time and size, so a changed file is re-decoded instead of showing a stale image forever.
            - Dominant-colour sampling runs off the UI thread and is cached per logo.
            - Every decoded bitmap is frozen before it is bound, so it can cross threads safely.

            ## Bug fixes

            - The application project no longer compiles the unit-test sources (the root `GameLauncher.csproj` sat inside the SDK's default `**/*.cs` glob), which is what broke CI and blocked the earlier beta release.
            - The ImageSharp fallback decode path again resolves `Mutate` / `Resize` (they are extension methods in `SixLabors.ImageSharp.Processing`).
            - Path safety no longer treats a path that does not exist as a reparse point. That previously made the cache cleaner reject a not-yet-created cache directory, which would have thrown on first run.
            - Saving an existing game clones the stored item, so `LastPlayed`, launch count, favourites, categories and the cached dominant colour survive an edit.
            - The unit tests import `System.IO` explicitly instead of relying on implicit usings.

            ## Downloads

            | Package | File |
            | --- | --- |
            | Windows x64 portable (self-contained) | `GFnoLauncher-2.0.0-win-x64-portable.zip` |
            | Windows x64 installer | `GFnoLauncher-Setup-2.0.0.exe` |

            `SHA256SUMS.txt` is attached to this release and lists the SHA-256 digest of both packages.

            The portable ZIP is a single self-contained executable: it needs no local .NET installation and no development server. The installer installs to `%ProgramFiles%\GFno Launcher`, creates a Start Menu shortcut, offers an optional desktop shortcut and does not require Administrator rights.

            ## Compatibility

            - Windows 10 / 11, 64-bit.
            - No .NET runtime installation required: both packages are self-contained for `win-x64`.
            - User data lives in `%LocalAppData%\GameLauncher` and is never modified by installation or uninstallation. An existing `library.json` from an earlier version loads unchanged.

            ## Note

            This release keeps the current WPF interface. The React / TypeScript / WebView2 frontend and the performance-features phase are planned for a later increment and are **not** part of this release.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained single-file executable
        run: >-
          dotnet publish
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o "${{ github.workspace }}/publish"

      # ---- Portable build -------------------------------------------------
      - name: Create ZIP archive (portable)
        run: Compress-Archive -Path "${{ github.workspace }}/publish/*" -DestinationPath "${{ github.workspace }}/GameLauncher.zip"

      # ---- Installer ------------------------------------------------------
      - name: Install Inno Setup
        run: |
          curl.exe -L --fail --silent --show-error `
            -o "$env:TEMP\innosetup.exe" `
            "https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe"
          Start-Process -FilePath "$env:TEMP\innosetup.exe" `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CLOSEAPPLICATIONS","/RESTARTAPPLICATIONS" `
            -Wait
          $candidates = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not found after installing Inno Setup." }
          Write-Host "Using Inno Setup compiler: $iscc"
          "ISCC=$iscc" | Out-File -FilePath "$env:GITHUB_ENV" -Encoding utf8 -Append

      - name: Compile installer
        run: |
          $log = "$env:GITHUB_WORKSPACE\iscc.log"
          $out = & "$env:ISCC" "$env:GITHUB_WORKSPACE\setup.iss" 2>&1
          $code = $LASTEXITCODE
          $out | Out-File -FilePath $log -Encoding utf8
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $text = $out | Out-String
            if ($text.Length -gt 1600) { $text = $text.Substring($text.Length - 1600) }
            throw "Inno Setup failed with exit code $code.`n$text"
          }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\GameLauncherSetup.exe")) {
            throw "GameLauncherSetup.exe was not produced. See the iscc-log artifact."
          }
          Write-Host "Installer produced: $env:GITHUB_WORKSPACE\GameLauncherSetup.exe"

      - name: Upload Inno Setup log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iscc-log
          path: iscc.log
          if-no-files-found: ignore
          retention-days: 1

      # ---- Release --------------------------------------------------------
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GameLauncher.zip
            GameLauncherSetup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Debug
        if: always()
        continue-on-error: true
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE "debug.log"
          dotnet --info *>&1 | Tee-Object -FilePath $log
          dotnet nuget list source *>&1 | Tee-Object -FilePath $log -Append
          dotnet restore tests/GFnoLauncher.Tests/GFnoLauncher.Tests.csproj -v normal *>&1 | Tee-Object -FilePath $log -Append
          dotnet build tests/GFnoLauncher.Tests/GFnoLauncher.Tests.csproj -c Release --no-restore --nologo -v normal *>&1 | Tee-Object -FilePath $log -Append
          Write-Host "DEBUG DONE"
          dotnet list tests/GFnoLauncher.Tests/GFnoLauncher.Tests.csproj package --include-transitive *>&1 | Tee-Object -FilePath $log -Append
          $lines = Get-Content $log | Where-Object { $_ -notmatch 'api\.nuget\.org' -and $_ -match 'Restored|error|warning|NU[0-9]{3}|Not found|Assets file|xunit/[0-9]|Test\.Sdk/[0-9]|xunit Core|xunit Assert' }
          $n = 0
          foreach ($line in $lines) {
            $n++
            if ($n -gt 40) { break }
            Write-Host ("::error file=debug.log,line={0}::{1}" -f $n, $line)
          }

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            debug.log
            tests/GFnoLauncher.Tests/obj/project.assets.json
          if-no-files-found: warn
          retention-days: 1

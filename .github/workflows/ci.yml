name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Debug
        if: always()
        continue-on-error: true
        run: |
          dotnet --info 2>&1 | Tee-Object -FilePath debug.log
          dotnet nuget list source 2>&1 | Tee-Object -FilePath -Append debug.log
          dotnet restore tests/GFnoLauncher.Tests/GFnoLauncher.Tests.csproj -v normal 2>&1 | Tee-Object -FilePath -Append debug.log
          dotnet build tests/GFnoLauncher.Tests/GFnoLauncher.Tests.csproj -c Release --no-restore --nologo -v normal 2>&1 | Tee-Object -FilePath -Append debug.log
          $lines = Get-Content debug.log | Where-Object { $_ -match 'xunit|Test\.Sdk|error|warning|Unable|NU[0-9]{3}|not found|Assets file|Restored' }
          $lineNo = 0
          foreach ($line in $lines) {
            $lineNo++
            $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($line))
            Write-Host "::error file=debug.log,line=$lineNo::$b64"
            if ($lineNo -ge 30) { break }
          }
          Write-Host "DEBUG DONE"

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            debug.log
            tests/GFnoLauncher.Tests/obj/project.assets.json
          if-no-files-found: warn
          retention-days: 1

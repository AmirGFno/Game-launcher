name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build
        shell: pwsh
        run: |
          dotnet build GameLauncher.csproj -c Release --nologo -v minimal 2>&1 | Tee-Object build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { Get-Content build.log | Select-String 'error ' | Select-Object -Unique | ForEach-Object { Write-Output "::error::$_" } }
          exit $code

      - name: Test
        run: dotnet test tests/GFnoLauncher.Tests/GFnoLauncher.Tests.csproj -c Release --nologo -v minimal

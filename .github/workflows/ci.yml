name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build GameLauncher.csproj -c Release --nologo -v minimal

      - name: Test
        continue-on-error: true
        run: |
          dotnet test tests/GFnoLauncher.Tests/GFnoLauncher.Tests.csproj -c Release --nologo -v normal 2>&1 | Tee-Object -FilePath test.log
          Write-Host "EXITCODE $LASTEXITCODE"

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            test.log
            tests/GFnoLauncher.Tests/obj/project.assets.json
          if-no-files-found: warn
          retention-days: 1
